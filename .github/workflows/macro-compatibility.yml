name: Test macro Xcode compatibility

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: '已发布宏制品的 ReerCodable 版本'
        type: string
        required: true
        default: '1.8.1'

permissions:
  contents: read

jobs:
  toolchains:
    runs-on: ubuntu-latest
    outputs:
      consumers: ${{ steps.matrix.outputs.consumers }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: matrix
        run: echo "consumers=$(jq -c . .github/xcode-runners.json)" >> "$GITHUB_OUTPUT"

  integration:
    needs: toolchains
    name: Macro ${{ matrix.producer }} on Xcode ${{ matrix.consumer.version }}
    runs-on: ${{ matrix.consumer.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        producer: ['26.4.1', '26.5', '26.6']
        consumer: ${{ fromJSON(needs.toolchains.outputs.consumers) }}
    env:
      DEVELOPER_DIR: ${{ matrix.consumer.developer_dir }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Download and verify released executable
        id: plugin
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          PRODUCER: ${{ matrix.producer }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="macros-$VERSION-xcode-$PRODUCER-arm64-flex-r1"
          gh release download "$tag" --repo "$REPOSITORY" --dir .github/integration/plugin
          cd .github/integration/plugin
          shasum -a 256 -c SHA256SUMS
          jq -e --arg tag "$tag" '.release_tag == $tag and .architecture == "arm64" and .auto_flexible_type == true' manifest.json
          commit=$(jq -r .upstream_commit manifest.json)
          [[ "$commit" =~ ^[a-f0-9]{40}$ ]]
          tar -xzf ReerCodableMacros.tar.gz
          test -x ReerCodableMacros
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: reers/ReerCodable
          ref: ${{ steps.plugin.outputs.commit }}
          path: .github/integration/upstream
          persist-credentials: false
      - name: Install project generator
        run: command -v xcodegen || brew install xcodegen
      - name: Run real Xcode project tests and iOS build
        working-directory: .github/integration
        env:
          PRODUCER: ${{ matrix.producer }}
          CONSUMER: ${{ matrix.consumer.version }}
        run: bash ../scripts/test-xcode-integration.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compatibility-${{ matrix.producer }}-on-${{ matrix.consumer.version }}
          path: .github/integration/results
          if-no-files-found: warn
          retention-days: 14

  cocoapods:
    needs: toolchains
    name: CocoaPods on Xcode ${{ matrix.consumer.version }}
    runs-on: ${{ matrix.consumer.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        consumer: ${{ fromJSON(needs.toolchains.outputs.consumers) }}
    env:
      DEVELOPER_DIR: ${{ matrix.consumer.developer_dir }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install project generator
        run: command -v xcodegen || brew install xcodegen
      - name: Install CocoaPods if missing
        run: command -v pod || brew install cocoapods
      - name: Resolve tested release source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release download "macros-$VERSION-xcode-26.6-arm64-flex-r1" --repo "$REPOSITORY" --pattern manifest.json --dir source-manifest
          commit=$(jq -r .upstream_commit source-manifest/manifest.json)
          [[ "$commit" =~ ^[a-f0-9]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: reers/ReerCodable
          ref: ${{ steps.source.outputs.commit }}
          path: .github/cocoapods/runtime
          persist-credentials: false
      - name: Render versioned podspec
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          ruby .github/scripts/test-render-podspec.rb
          ruby .github/scripts/render-podspec.rb "$VERSION" "$SOURCE_COMMIT" > .github/cocoapods/runtime/ReerCodable.podspec.json
          mkdir -p .github/cocoapods/results
          cp .github/cocoapods/runtime/ReerCodable.podspec.json .github/cocoapods/results/
      - name: Generate and install CocoaPods integration project
        working-directory: .github/cocoapods
        run: |
          xcodegen generate
          pod install
      - name: Test downloaded macro via CocoaPods
        working-directory: .github/cocoapods
        run: |
          mkdir -p results
          xcodebuild test -workspace PodIntegration.xcworkspace -scheme MacIntegration -destination 'platform=macOS,arch=arm64' -derivedDataPath build-mac -resultBundlePath results/CocoaPods.xcresult > results/mac-test.log 2>&1
          xcodebuild build -workspace PodIntegration.xcworkspace -scheme iOSIntegration -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath build-ios > results/ios-build.log 2>&1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cocoapods-${{ matrix.consumer.version }}
          path: .github/cocoapods/results
          retention-days: 14

  publish-spec:
    needs: [integration, cocoapods]
    runs-on: ubuntu-latest
    concurrency:
      group: reercodable-spec-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cocoapods-26.6
          path: verified
      - name: Publish only the tested specification
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="macros-$VERSION-xcode-26.6-arm64-flex-r1"
          cd verified
          sha256sum ReerCodable.podspec.json > ReerCodable.podspec.json.sha256
          assets=$(gh release view "$tag" --repo "$REPOSITORY" --json assets --jq '.assets[].name')
          if grep -qx 'ReerCodable.podspec.json' <<< "$assets"; then
            gh release download "$tag" --repo "$REPOSITORY" --pattern ReerCodable.podspec.json --dir existing
            cmp ReerCodable.podspec.json existing/ReerCodable.podspec.json
          else
            gh release upload "$tag" ReerCodable.podspec.json --repo "$REPOSITORY"
          fi
          if ! grep -qx 'ReerCodable.podspec.json.sha256' <<< "$assets"; then
            gh release upload "$tag" ReerCodable.podspec.json.sha256 --repo "$REPOSITORY"
          fi

  report:
    needs: [integration, cocoapods]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: compatibility-*
          path: results
      - name: Collect compatibility matrix
        env:
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          COCOAPODS_RESULT: ${{ needs.cocoapods.result }}
        run: |
          {
            echo '## Downloaded macro Xcode compatibility'
            echo "Overall result: $INTEGRATION_RESULT"
            echo "CocoaPods integration: $COCOAPODS_RESULT"
            echo '| Macro built with | Consumer Xcode | macOS XCTest | iOS Simulator Release |'
            echo '| --- | --- | --- | --- |'
            cat results/*/summary.md
          } >> "$GITHUB_STEP_SUMMARY"
